name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      platform:
        description: 'Build platform'
        required: true
        default: 'win-x64'
        type: choice
        options:
          # ⚠️ 当前仅构建 Windows x64，其余架构暂时屏蔽（恢复时取消注释即可）
          # - all
          # - win
          - win-x64
          # - win-arm64
          # - mac
          # - linux
  push:
    tags:
      - v*.*.*

  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # ⚠️ 当前仅构建 Windows x64，其余架构（win-arm64 / mac / linux）暂时屏蔽。
        # 恢复多平台时，把 include 换回依赖 inputs.platform 的三元表达式即可（见 git 历史）。
        include:
          - { os: windows-latest, platform: win, arch: x64, build_command: pnpm build:win:x64 }
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Set version
        shell: bash
        run: |
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install Dependencies
        run: pnpm install

      - name: Install macOS deps
        if: matrix.platform == 'mac'
        run: brew install python-setuptools

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libevdev-dev libxtst-dev libx11-dev libxfixes-dev libwayland-dev

      - name: Prepare env file
        shell: bash
        run: cp -f .env.example .env

      - name: Build
        shell: bash
        run: ${{ matrix.build_command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Rename Windows Build Metadata
        if: matrix.platform == 'win'
        shell: bash
        run: |
          if [ -f dist/latest.yml ]; then
            mv dist/latest.yml dist/latest-win-${{ matrix.arch }}.yml
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zyfun-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 8

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # 只要还有成功构建的产物就发布，避免个别矩阵任务（如 windows-11-arm）失败导致整个 Release 缺失
    if: always() && needs.prepare.result == 'success' && needs.build.result != 'cancelled'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge Windows Update Metadata
        shell: bash
        run: |
          set -e

          WIN_X64="dist/latest-win-x64.yml"
          WIN_ARM="dist/latest-win-arm64.yml"

          if [[ -f "$WIN_X64" && -f "$WIN_ARM" ]]; then
            yq eval-all 'select(fi == 0) .files += [select(fi == 1) .files[]] | select(fi == 0)' "$WIN_X64" "$WIN_ARM" > dist/latest.yml
            rm -f "$WIN_X64" "$WIN_ARM"
            exit 0
          elif [[ -f "$WIN_X64" ]]; then
            mv "$WIN_X64" dist/latest.yml
          elif [[ -f "$WIN_ARM" ]]; then
            mv "$WIN_ARM" dist/latest.yml
          fi

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ needs.prepare.outputs.tag }}
          artifacts: 'dist/*'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        # 打包并上传完成后把草稿转为正式发布，否则 Releases 页面看不到资产
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest
